# Deploy Lexicon Manor to GitHub Pages — OWNER: A8 (Platform).
#
# Build carries the /LexiconManor/ base (vite.config.ts default; MANOR_BASE
# pins it explicitly here), then scripts/build-sw-precache.ts injects the SW
# precache manifest, stamps the webmanifest, and HARD-FAILS the build if any
# artifact lacks the base prefix (AAA 7.5).
#
# BUILD INTEGRITY (REVIEW_AA §0 / §5.5). The whole build runs through
# `npm run build:pages` → scripts/build.ts, which clears dist/ first and clears
# it again on any failure, so a red step can never leave a half-built or
# previous artifact for upload-pages-artifact to pick up. The build writes
# dist/build-stamp.json (source fingerprint + git SHA) and compiles the same
# edition id into the app; the explicit verify step below re-derives the
# fingerprint from the checkout and fails the deploy if the artifact does not
# match the tree it claims to come from.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MANOR_BASE: /LexiconManor/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fails in ~15s before the slower gates — build:pages typechecks again.
      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      # Gates + typecheck + vite build + SW precache, clean-first. Any failure
      # removes dist/ entirely — there is nothing stale to fall back on.
      - name: Build (clean · typechecked · stamped)
        run: npm run build:pages
        env:
          MANOR_GIT_SHA: ${{ github.sha }}

      # Independent re-verification: recompute the source fingerprint from the
      # checkout and refuse to deploy an artifact that does not match it.
      - name: Verify dist matches this commit
        run: npm run check:dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ══ THE GLASS GATE ═══════════════════════════════════════════════════════
  # scripts/smoke-gate.mjs — its OWN job, deliberately.
  #
  # WHY IT IS NOT A STEP IN `build`. A browser pass is minutes, not seconds,
  # and the fast unit suite's whole value is that it comes back before you have
  # switched windows. Bolting a Playwright walk onto it would make 1,358 tests
  # feel like a browser pass, and the first thing a slow gate loses is the
  # habit of running it. So the two run side by side and `deploy` waits on
  # both — a red glass gate does not deploy.
  #
  # WHY THE BROWSER IS DIFFERENT HERE. The local rule in this repo is "system
  # Edge, channel msedge, NEVER download a playwright browser", because the
  # download silently fails on the owner's machine. That is a LOCAL rule about
  # ONE machine. The runner is a different machine with no Edge and a working
  # network, so it installs playwright's own pinned chromium — which is also
  # the more reproducible choice for CI, since the version is pinned by
  # package-lock rather than by whatever Windows Update shipped that week. The
  # gate takes the browser from MANOR_GATE_CHANNEL and defaults to msedge, so
  # nothing about the local rule changes.
  glass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Instant, and it fails before a browser is ever downloaded: if the
      # gate's own verdicts have stopped detecting the defects they were
      # written for, nothing measured afterwards would mean anything.
      - name: Gate self-test (the gate's own judgement)
        run: npm run gate:glass:self-test

      - name: Install chromium for playwright
        run: npx playwright install --with-deps chromium

      # The gate serves dist/ through `vite preview`, which refuses to start on
      # a dist that does not match this checkout — so the build must be real.
      - name: Build (clean · typechecked · stamped)
        run: npm run build
        env:
          MANOR_GIT_SHA: ${{ github.sha }}

      - name: Glass gate — 375x667 then 390x844
        run: npm run gate:glass
        env:
          MANOR_GATE_CHANNEL: chromium

  deploy:
    needs: [build, glass]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
